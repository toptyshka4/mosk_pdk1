{% extends 'pdk_system/base.html' %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-4">
    <h3>Вход</h3>
    <form method="post">{% csrf_token %}
      <div class="mb-3"><label>Логин</label><input type="text" name="username" class="form-control"></div>
      <div class="mb-3"><label>Пароль</label><input type="password" name="password" class="form-control"></div>
      <button class="btn btn-primary">Войти</button>
    </form>
  </div>
</div>
{% endblock %}
